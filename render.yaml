# Render Blueprint — the full stack: patient/lab/audit-service, api-gateway
# (single entry point), notification-service (real-time critical alerts via
# Socket.io), the React frontend (static site), and their shared Postgres and
# Redis (Key Value). analytics-service is still out of scope.
#
# Deploy: Render dashboard -> New -> Blueprint -> point at this repo.
# JWT_PRIVATE_KEY is `sync: false` — Render will prompt for it once during
# Blueprint creation; paste the base64 of the PEM (see shared/entrypoint.sh
# for why base64, and shared/keys/README for how to generate one). The
# matching public key ships baked into every image at
# shared/keys/prod_jwt_public.pem — it's not secret, so it doesn't need to
# survive a round trip through a web form. Everything else wires up
# automatically.
#
# api-gateway/notification-service reach patient/lab/audit-service via their
# public onrender.com URLs rather than Render's internal service-to-service
# networking — see the plan's "Deviations" section
# (/Users/hirusidhu/.claude/plans/ancient-rolling-moler.md) for why; this is
# proven to work (same URLs used for this project's live smoke tests) where
# the internal-networking Blueprint field name isn't.
#
# Free-tier caveats: free Postgres expires 30 days after creation (needs a
# manual upgrade or recreation before then); free Key Value data is
# in-memory only and clears on restart (fine here — it's just cache +
# stream/dedup state, nothing durable lives there); free web services spin
# down after 15 min idle and cold-start on the next request (api-gateway's
# 60s proxy timeout covers this; the frontend's WebSocket connection to
# notification-service will show "reconnecting" during a cold start rather
# than hanging).

databases:
  - name: healthsync-db
    databaseName: healthsync
    user: healthsync
    plan: free

services:
  - type: keyvalue
    name: healthsync-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: healthsync-patient-service
    runtime: docker
    plan: free
    dockerfilePath: services/patient-service/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: healthsync-db
          property: connectionString
      - key: DB_SCHEMA
        value: patient
      - key: REDIS_URL
        fromService:
          name: healthsync-redis
          type: keyvalue
          property: connectionString
      - key: JWT_PRIVATE_KEY_PATH
        value: /secrets/jwt_private.pem
      - key: JWT_PUBLIC_KEY_PATH
        value: /app/shared/keys/prod_jwt_public.pem
      - key: JWT_PRIVATE_KEY
        sync: false

  - type: web
    name: healthsync-lab-service
    runtime: docker
    plan: free
    dockerfilePath: services/lab-service/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: healthsync-db
          property: connectionString
      - key: DB_SCHEMA
        value: lab
      - key: REDIS_URL
        fromService:
          name: healthsync-redis
          type: keyvalue
          property: connectionString
      - key: JWT_PUBLIC_KEY_PATH
        value: /app/shared/keys/prod_jwt_public.pem

  - type: web
    name: healthsync-audit-service
    runtime: docker
    plan: free
    dockerfilePath: services/audit-service/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: healthsync-db
          property: connectionString
      - key: DB_SCHEMA
        value: audit
      - key: REDIS_URL
        fromService:
          name: healthsync-redis
          type: keyvalue
          property: connectionString
      - key: JWT_PUBLIC_KEY_PATH
        value: /app/shared/keys/prod_jwt_public.pem

  - type: web
    name: healthsync-api-gateway
    runtime: docker
    plan: free
    dockerfilePath: services/api-gateway/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PATIENT_SERVICE_URL
        value: https://healthsync-patient-service.onrender.com
      - key: LAB_SERVICE_URL
        value: https://healthsync-lab-service.onrender.com
      - key: AUDIT_SERVICE_URL
        value: https://healthsync-audit-service.onrender.com
      - key: REDIS_URL
        fromService:
          name: healthsync-redis
          type: keyvalue
          property: connectionString
      - key: JWT_PUBLIC_KEY_PATH
        value: /app/shared/keys/prod_jwt_public.pem
      - key: CORS_ORIGINS
        value: https://healthsync-frontend-khoe.onrender.com
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX
        value: "100"

  - type: web
    name: healthsync-notification-service
    runtime: docker
    plan: free
    dockerfilePath: services/notification-service/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: REDIS_URL
        fromService:
          name: healthsync-redis
          type: keyvalue
          property: connectionString
      - key: JWT_PUBLIC_KEY_PATH
        value: /app/shared/keys/prod_jwt_public.pem
      - key: CORS_ORIGINS
        value: https://healthsync-frontend-khoe.onrender.com

  # onrender.com subdomains are global across all Render accounts, not just
  # this one - "healthsync-frontend" was already taken, so this service's
  # actual live URL is https://healthsync-frontend-khoe.onrender.com (the
  # suffix Render appended), not the https://healthsync-frontend.onrender.com
  # the `name` below would suggest. The CORS_ORIGINS values above use the
  # real one; keep them in sync if this service ever gets recreated (a
  # fresh create could get a different random suffix).
  - type: web
    name: healthsync-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    # The published JSON Schema's field description says this is "relative
    # to the repo root" even with rootDir set, but that's wrong in practice:
    # a live deploy with staticPublishPath=./frontend/dist build succeeded
    # (dist/ was produced) but then failed with "Publish directory
    # ./frontend/dist does not exist!" - rootDir actually scopes this path
    # too, same as buildCommand's cwd. Relative to rootDir (frontend/), not
    # the repo root.
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_GATEWAY_URL
        value: https://healthsync-api-gateway.onrender.com
      - key: VITE_NOTIFICATION_SERVICE_URL
        value: https://healthsync-notification-service.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
